<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafaf8" />

    <!-- GEO: entity + geographic identifiers for AI answer engines and local search -->
    <meta name="geo.region" content="MW" />
    <meta name="geo.placename" content="Lilongwe, Malawi" />
    <meta name="geo.position" content="-13.9626;33.7741" />
    <meta name="ICBM" content="-13.9626, 33.7741" />
    <meta name="format-detection" content="telephone=yes" />
    <meta property="og:locale" content="en_MW" />
    <meta name="author" content="Peter Rodrigues Butao" />

    <!-- Per-page title/description/canonical/OG/schema are injected by the <Seo> component. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
    <link rel="preload" as="image" href="%sveltekit.assets%/profile.webp" fetchpriority="high">
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
