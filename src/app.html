<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peter Butao Portfolio</title>
    <meta name="description" content="Peter Butao's professional portfolio showcasing projects, experience, and services." />
    <meta name="keywords" content="Peter Butao, portfolio, web development, Svelte, AI, SEO" />
    <meta name="author" content="Peter Butao" />
    <!-- Open Graph -->
    <meta property="og:title" content="Peter Butao Portfolio" />
    <meta property="og:description" content="Explore Peter Butao's projects and services." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://peterbutao.pages.dev" />
    <meta property="og:image" content="https://peterbutao.pages.dev/static/profile.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peter Butao Portfolio" />
    <meta name="twitter:description" content="Explore Peter Butao's projects and services." />
    <meta name="twitter:image" content="https://peterbutao.pages.dev/static/profile.png" />
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Peter Butao",
      "url": "https://peterbutao.pages.dev",
      "sameAs": [
        "https://github.com/PeterButao",
        "https://www.linkedin.com/in/peterbutao"
      ],
      "jobTitle": "Software Engineer",
      "worksFor": {
        "@type": "Organization",
        "name": "Self-Employed"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
