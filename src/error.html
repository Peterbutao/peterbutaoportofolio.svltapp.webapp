<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.status% — Something went wrong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: 'Inter', sans-serif;
        background:
          radial-gradient(120% 90% at 12% 0%, #fff8d6 0%, transparent 55%),
          radial-gradient(120% 90% at 90% 100%, #fff1bd 0%, transparent 50%),
          #FAFAF8;
        color: #0D0D0D;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      .blobs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        animation: drift 18s ease-in-out infinite alternate;
      }
      .b1 { top: -10%; left: -8%; width: 300px; height: 300px; background: #ffcc00; opacity: 0.55; }
      .b2 { top: 10%; right: -10%; width: 340px; height: 340px; background: #ffd43b; opacity: 0.45; animation-delay: -8s; animation-duration: 24s; }
      .b3 { bottom: -12%; left: 24%; width: 360px; height: 360px; background: #ffe066; opacity: 0.4; animation-delay: -4s; animation-duration: 14s; }

      @keyframes drift {
        0%   { transform: translate3d(0, 0, 0) scale(1); }
        50%  { transform: translate3d(24px, -30px, 0) scale(1.12); }
        100% { transform: translate3d(-18px, 22px, 0) scale(0.95); }
      }

      .card {
        position: relative;
        z-index: 1;
        background: rgba(250, 250, 248, 0.6);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        border: 1px solid rgba(255, 204, 0, 0.35);
        border-radius: 18px;
        box-shadow: inset 0 0 120px rgba(255, 204, 0, 0.08), 0 24px 60px rgba(0, 0, 0, 0.10);
        max-width: 520px;
        width: calc(100% - 48px);
        padding: 52px 36px;
        text-align: center;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .eyebrow {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #6B7280;
      }

      .code-wrap { margin: 16px 0 8px; }
      .code {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(6rem, 24vw, 12rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
        color: transparent;
        -webkit-text-stroke: 3px #0D0D0D;
        text-shadow: 10px 12px 0 #FFCC00;
      }

      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(1.3rem, 4.5vw, 1.9rem);
        letter-spacing: 0.1em;
        margin-bottom: 10px;
      }

      p {
        color: #6B7280;
        font-size: 0.9rem;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 26px;
        background: #0D0D0D;
        color: #FAFAF8;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.14em;
        border: 1.5px solid #0D0D0D;
        border-radius: 7px;
        padding: 14px 40px;
        transition: background 0.2s, color 0.2s;
      }

      a:hover {
        background: #FFCC00;
        color: #0D0D0D;
        border-color: #FFCC00;
      }

      .foot {
        position: fixed;
        bottom: 18px;
        width: 100%;
        text-align: center;
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #9aa0a6;
        z-index: 2;
      }

      @media (prefers-reduced-motion: reduce) {
        .blob { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="blobs" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>

    <div class="card" id="card">
      <p class="eyebrow">SYSTEM STATUS</p>
      <div class="code-wrap"><div class="code">%sveltekit.status%</div></div>
      <h1>Something went wrong</h1>
      <p>%sveltekit.error.message%</p>
      <a href="/">BACK TO HOME</a>
    </div>

    <p class="foot">PETER RODRIGUES BUTAO &nbsp;·&nbsp; &copy; <span id="year"></span></p>

    <script>
      (function () {
        document.getElementById('year').textContent = new Date().getFullYear();

        var card = document.getElementById('card');
        if (!card) return;

        card.addEventListener('mousemove', function (e) {
          var r = card.getBoundingClientRect();
          var rx = ((e.clientY - r.top - r.height / 2) / r.height) * 8;
          var ry = ((e.clientX - r.left - r.width / 2) / r.width) * -8;
          card.style.transform =
            'perspective(900px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
        });

        card.addEventListener('mouseleave', function () {
          card.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
        });
      })();
    </script>
  </body>
</html>
